# Render Blueprint — free-tier backend for PROGNOS.
# The frontend is on Vercel; Postgres is on Neon (set DATABASE_URL below).
# No Redis / Celery worker on the free tier: background sync runs via the
# /api/v1/cron/* endpoints triggered by cron-job.org (see docs/deployment_golive_plan.md).
services:
  - type: web
    name: prognos-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # NOTE: this value is only honored when the service is FIRST created.
    # The live service actually runs in us-west1 (its origin resolves to
    # gcp-us-west1-1.origin.onrender.com) because it predates the region change
    # in a805e8c. Every query therefore crosses the Pacific to Neon in
    # ap-southeast-1. Fixing it requires DELETING and RECREATING the service --
    # editing this line does nothing. See docs/uptime_runbook.md.
    region: singapore
    # Keep this pointed at /api/v1/health, which does NO database I/O.
    # /api/v1/ready checks Postgres and must never be the health check: Neon
    # scales to zero, so a DB-dependent probe can fail right after a deploy and
    # get the deploy marked failed.
    healthCheckPath: /api/v1/health
    # Migrations run at container start (Dockerfile CMD) — free tier does not
    # support preDeployCommand.
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      # Secrets — set these in the Render dashboard (sync: false keeps them
      # out of the repo). Neon: use the DIRECT connection string (asyncpg).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: CLIST_USERNAME
        sync: false
      - key: CLIST_API_KEY
        sync: false
